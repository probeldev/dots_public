# Openers (macOS)
[opener]
quicklook = [
	{ run = "qlmanage -p %s", orphan = true, desc = "Quick Look", for = "macos" },
]
quicktime = [
	{ run = "open -a 'QuickTime Player' %s", orphan = true, desc = "QuickTime Player", for = "macos" },
]
vlc = [
	{ run = "open -a VLC %s", orphan = true, desc = "VLC", for = "macos" },
]
gridcraft = [
	{ run = "open -a GridCraft %s", orphan = true, desc = "GridCraft", for = "macos" },
]
wps = [
	{ run = "open -a wpsoffice %s", orphan = true, desc = "WPS Office", for = "macos" },
]

[[open.prepend_rules]]
url  = "*.{xls,xlsx,xlsm,xlsb}"
use  = [ "gridcraft", "wps", "open" ]

[[open.prepend_rules]]
mime = "image/*"
use  = [ "quicklook", "open", "edit" ]

[[open.prepend_rules]]
mime = "video/*"
use  = [ "quicklook", "quicktime", "vlc", "open" ]
