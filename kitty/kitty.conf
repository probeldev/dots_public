# Шрифт — как в остальных терминалах
# PostScript-имя — точный матч (family="FiraCode Nerd Font Mono" style="Retina"
# kitty по full name не резолвил и молча фолбэчился на шрифт без лигатур)
font_family postscript_name=FiraCodeNFM-Ret
font_size 18

# Лигатуры (Fira Code: -> => != и т.д.) — never = всегда включены
disable_ligatures never

# Тема GitHub Light Default (палитра из ghostty-темы, сконвертирована)
include themes/github-light.conf

# Процесс умирает при закрытии последнего окна (как в rio) — иначе при открытии
# по хоткею из skhd копятся процессы
macos_quit_when_last_window_closed yes

# Не спрашивать подтверждение при закрытии окна с запущенными программами
confirm_os_window_close 0

# Скрыть заголовок окна (рамка и кнопки остаются)
hide_window_decorations titlebar-only

# Отступ текста от краёв окна, px
window_padding_width 10

# Поджать высоту строки (у rio ячейки компактнее, в kitty по умолчанию выше)
adjust_line_height -2

# Прозрачность + blur (эффект стекла macOS)
background_opacity 0.92
background_blur 64
